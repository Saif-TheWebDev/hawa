name: Import supplied Chicken Biryani image
on:
  push:
    paths:
      - '.github/workflows/import-hawa-chicken.yml'
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hawa-follow-the-aroma
      - name: Import chicken image and fix menu
        env:
          IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2Fb7b8a66f-ee46-46b4-84d5-8dfa316143c3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALmA5iIUSaC-dtPICDz6R2P4cIYHl-Vrx8A460-EE1XU&exp=1793717886&osig=AAAAAAAAAAAAAAAAAAAAAHsvmOzf97nE4H_s8qSfbWO4cL8uZiQBTpwX5f_M-xHd&signer=media-rpc&token=AAIAAU0AJGI3YjhhNjZmLWVlNDYtNDZiNC04NGQ1LThZmEzMTYxNDNjMwAAAAABoaHq3DCFKk8pBmCnvz3JLLuLA_X2FuMWHDB1pgvUc0Nve2G2aA&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets
          curl -fLsS --retry 3 "$IMAGE_URL" -o assets/hawa-chicken-biryani.jpg
          test -s assets/hawa-chicken-biryani.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shop.js')
          s=p.read_text()
          old='id: "chicken-biryani",'
          a=s.index(old)
          b=s.index('    },',a)
          chunk=s[a:b]
          assert 'img: IMG.biryani,' in chunk
          chunk=chunk.replace('img: IMG.biryani,','img: "assets/hawa-chicken-biryani.jpg",').replace('generated: true,','generated: false,')
          s=s[:a]+chunk+s[b:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hawa-chicken-biryani.jpg shop.js
          git commit -m "Use distinct uploaded Chicken Biryani image"
          git push origin HEAD:codex/hawa-follow-the-aroma
