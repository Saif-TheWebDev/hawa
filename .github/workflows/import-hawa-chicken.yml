name: Import supplied Chicken Biryani image
on:
  push:
    paths:
      - '.github/workflows/import-hawa-chicken.yml'
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hawa-follow-the-aroma
      - name: Import chicken image and fix menu
        env:
          IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2F5056847c-7750-433d-8238-a40b8e3b54c2/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGRiwlBvsMcUtpqOlyqB5rDr_IVaZcPSCHD485b-zkOJ&exp=1793716954&osig=AAAAAAAAAAAAAAAAAAAAADXEfmPx0x2JhzlRoWUW1S230yRmWilgWAW12hr6lYyk&signer=media-rpc&token=AAIAAU0AJDUwNTY4NDdjLTc3NTAtNDMzZC04MjM4LWE0MGI4ZTNiNTRjMgAAAAABoaHco5BSNxajcpDaXIJakxYf0sH51RVclVpHuxO0mRsbBP_I9Q&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets
          curl -fLsS --retry 3 "$IMAGE_URL" -o assets/hawa-chicken-biryani.jpg
          test -s assets/hawa-chicken-biryani.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shop.js')
          s=p.read_text()
          old='id: "chicken-biryani",'
          a=s.index(old)
          b=s.index('    },',a)
          chunk=s[a:b]
          assert 'img: IMG.biryani,' in chunk
          chunk=chunk.replace('img: IMG.biryani,','img: "assets/hawa-chicken-biryani.jpg",').replace('generated: true,','generated: false,')
          s=s[:a]+chunk+s[b:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hawa-chicken-biryani.jpg shop.js
          git commit -m "Use distinct uploaded Chicken Biryani image"
          git push origin HEAD:codex/hawa-follow-the-aroma
